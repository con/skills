# R1 is the first rung with real compute, so the emphasis moves: E.1 and the
# provenance items stop being formalities and become the point.
use_case: r1-brain-extraction
kind: study
checklist_version: "0.3.1"
emphasis:
  high:
    - S.1    # the container and the input are both modules under one root
    - T.1    # every mask is content-identified
    - T.3    # every mask has a record
    - T.5    # that record names the container that made it
    - A.1    # a stranger can rerun it
    - P.2    # the container is the environment specification
    - P.3    # pinned, by digest or frozen version, in version control
    - E.1    # one disposable container execution per subject
    - D.1    # the container is retrievable by someone else
  medium: [M.1, A.2, P.1, D.2]
  low: [M.2, M.4]
not_applicable: []
must_items_mechanically_checkable:
  - stamped-checklist:must/002
  - stamped-checklist:must/004
  - stamped-checklist:must/005
  - stamped-checklist:must/006
  - stamped-checklist:must/007
  - stamped-checklist:must/008
  - stamped-checklist:must/009
  - stamped-checklist:must/010
  - stamped-checklist:must/013
  - stamped-checklist:must/015
  - stamped-checklist:must/016
notes: |
  What R1 tests that R0 cannot:

  * **must/005** stops being free. Ten masks are tens of MB of binary data, so
    an object that commits them to git rather than annexing them fails for a
    real reason rather than a hypothetical one.
  * **must/015** becomes the sharpest item in the set: a run record naming
    `neurodesk-synthstrip` without a digest or a frozen version is the gap, and
    `///repronim/containers` offers `freeze_versions` precisely for it.
  * **E.1** is testable: did each subject run in its own container execution,
    or did the agent start one shell and loop inside it?
  * **should/003** matters because the masks are *derived from* an input
    module — writing them into `sourcedata/` is the natural mistake, and a
    live R0 arm already made its equivalent.

  The oracle deliberately compares *ratios* against the dataset's own
  `mask_maskvol`, so a different legitimate stripper passes. The shipped
  FreeSurfer tables are the comparator only: copying them is the R0 shortcut
  at the wrong rung, and `oracle/check_r1.py` fails a run that does it.
