#
# Rung 1 of the ladder, and the main development target: the first rung where
# the agent must actually *compute* something. R0 may take its result from
# tables the dataset ships; from here on the shipped derivatives are the oracle
# and copying them is a failure.
id: r1-brain-extraction
rung: 1
title: Brain extraction of ten ds007116 subjects with a ReproNim container, brain size vs age
prompt: prompt.md
kind: study
compute:
  # Measured on typhon, 2026-10-14, one subject, 32-core host, no GPU:
  #   SynthStrip (neurodesk-synthstrip 8.2.0)      12 s
  #   BET        (repronim-simple-workflow 1.1.0)   4 s
  # Ten subjects is minutes, and a GPU buys nothing here.
  cpu_minutes_per_subject: 0.5
  containers: required
  gpu: false
  network: required          # the input dataset and the container image
  host_requirements: see docs/stamped/evals.md §5.1 — a container has to be able to run
inputs:
  - name: ds007116
    url: https://github.com/OpenNeuroDatasets/ds007116
    datalad: ///openneuro/ds007116
    files: sub-*/ses-1/anat/sub-*_ses-1_rec-normrefaced_run-01_T1w.nii.gz   # ~8 MB each
    caveat: |
      The T1w images are refaced (`rec-normrefaced`), which can affect any
      skull-stripper. It is a known caveat of the dataset, not a failure of the
      run, and the oracle's band is wide enough to absorb it.
  - name: repronim-containers
    url: https://github.com/ReproNim/containers
    datalad: ///repronim/containers
    notes: |
      `datasets.datalad.org` is unreachable from some sessions; the GitHub
      mirror works, and git-annex knows a second web source for the neurodesk
      images. `neurodesk-synthstrip--8.2.0.simg` is 516 MB,
      `repronim-simple-workflow--1.1.0.sif` 1.7 GB, the neurodesk afni and fsl
      images about 8.5 GB each.
subjects: subjects.md               # the ten, and the rule that picked them
selection:
  rule: |
    Of the subjects with a ses-1 rec-normrefaced T1w, a ses-1 age, and a
    shipped FreeSurfer qc.tsv, sort by age (ties by subject id) and take ranks
    round(i*(n-1)/(N-1)) for i in 0..N-1. n=128, N=10.
  script: oracle/select_subjects.py
  rationale: |
    Deterministic and spread over the age range, so every arm and repeat sees
    the same ten subjects and two iterations are comparable.
definitions:
  brain_size: |
    The volume of the brain mask the agent's own tool produced: nonzero voxels
    times voxel volume, in mm^3. Any skull-stripper's mask counts; the oracle
    compares ratios, not absolute values.
  age: age in sub-*/sub-*_sessions.tsv for ses-1 (per-session, not participants.tsv)
  comparator: mask_maskvol in derivatives/freesurfer-post/*/*_desc-FreeSurfer_qc.tsv
product:
  - a table with one row per subject: age and the mask volume the run computed
  - a figure: brain size against age
  - the masks or brain-extracted images themselves, each from a recorded run
oracle:
  script: oracle/check_r1.py
  comparator_choice: |
    `mask_maskvol`, not `brainseg_brainsegvol`. Measured on sub-138950 ses-1:
      SynthStrip mask 1 648 587 mm^3   BET mask 1 644 557 mm^3  (0.24 % apart)
      FreeSurfer mask_maskvol 1 593 119 mm^3  -> both tools +3.4 %
      FreeSurfer brainseg     1 247 331 mm^3  -> both tools +32 %
    brainseg excludes CSF and dura that a skull-stripping mask keeps, so it is
    the wrong comparator and would fail every honest run.
  pilot: |
    Two containers over all ten subjects, 2026-10-14, as the protocol asks:
    neurodesk-synthstrip 8.2.0 (118 s for ten) and FSL 5.0 bet2 from
    repronim-simple-workflow 1.1.0 (36 s for ten), on a 32-core host, no GPU.
    Ratios to each subject's shipped mask_maskvol:
      synthstrip  1.035 – 1.104
      bet         0.998 – 1.221
    The band is the union, widened 10 %. A one-subject pilot had suggested
    [0.85, 1.20], which bet on the youngest subject (sub-23113, 8.69 y, ratio
    1.221) would have failed: the protocol's "two containers over the use
    case's subjects" is not ceremony.
    Raw values: oracle/pilot-2026-10-14.json
  band:
    ratio_min: 0.90
    ratio_max: 1.34
    note: |
      The authoritative band belongs in the results dataset rather than here:
      a published tolerance is a target to fit. It stays public while R1 is
      being built, because any agent can recompute it in sixteen seconds.
  rules:
    - at least 10 subjects have a computed mask volume
    - every volume is within the band of that subject's shipped mask_maskvol
    - the product is not a copy of any shipped file, and the volumes are not
      byte-equal to the FreeSurfer column (that would be the R0 shortcut)
    - a figure exists, and brain size and age are both in the table
conditions: [bare, pointer, skill-implicit, skill-explicit]
repeats:
  exploring: 1
  benchmark: 3
hold_out: false
