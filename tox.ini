[tox]
envlist = validate
skipsdist = true

[testenv]
basepython = python3.12

[testenv:validate]
description = Structural lint of all SKILL.md files and bundled Python scripts
skip_install = true
deps = pyyaml==6.0.3
commands =
    python3 {toxinidir}/ci/validate_skills.py {posargs}
    python3 -m unittest discover -s {toxinidir}/ci/tests -v

[testenv:security-static]
description = Static security scan via cisco skill-scanner (YARA, AST, dataflow — no API key needed)
skip_install = true
deps = cisco-ai-skill-scanner==2.1.0
commands = skill-scanner scan-all {toxinidir} --fail-on-severity high {posargs}

[testenv:security-llm]
description =
    Read-only LLM-based security review of skill directories.
    Requires Claude Code 2.1.248+ with --restricted and --bare support.
    Override the launcher via SECURITY_CMD, e.g.:
      SECURITY_CMD="yolo --worktree=skip --" tox -e security-llm
    Default SECURITY_CMD: claude
skip_install = true
deps =
passenv =
    SECURITY_CMD
    FAIL_ON
    ANTHROPIC_API_KEY
commands = python3 {toxinidir}/ci/security_review.py {posargs}

[testenv:security-deps]
description = Known-vulnerability audit of validation and scanner dependencies
skip_install = true
deps =
    {[testenv:validate]deps}
    {[testenv:security-static]deps}
    pip-audit==2.10.1
commands = pip-audit
