[tox]
envlist = validate, stamped-evals
skipsdist = true

[testenv:validate]
description = Structural lint of all SKILL.md files and bundled Python scripts
skip_install = true
deps = pyyaml
commands = python3 {toxinidir}/ci/validate_skills.py {posargs}

[testenv:stamped-evals]
description = Probe tests and mutant calibration for the STAMPED skills
skip_install = true
deps =
    pytest
    pyyaml
commands =
    python3 -m pytest {toxinidir}/evals/stamped/tests -q
    python3 {toxinidir}/evals/stamped/harness/calibrate.py {posargs}
