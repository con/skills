[tox]
envlist = validate
skipsdist = true

[testenv]
basepython = python3.12

[testenv:validate]
description = Structural lint of all SKILL.md files and bundled Python scripts
skip_install = true
deps = pyyaml==6.0.3
commands = python3 {toxinidir}/ci/validate_skills.py {posargs}

[testenv:security-static]
description = Static security scan via cisco skill-scanner (YARA, AST, dataflow — no API key needed)
skip_install = true
deps = cisco-ai-skill-scanner==2.1.0
commands = skill-scanner scan-all {toxinidir}/skills --fail-on-severity high {posargs}

[testenv:security-llm]
description =
    LLM-based security review of all skills (inline prompt, no --plugin-dir needed).
    Requires a working claude (or yolo) installation.
    Override the launcher via SECURITY_CMD, e.g.:
      SECURITY_CMD="yolo --worktree=skip --" tox -e security-llm
    Default SECURITY_CMD: claude --dangerously-skip-permissions
skip_install = true
deps =
passenv =
    SECURITY_CMD
    FAIL_ON
    ANTHROPIC_API_KEY
    HOME
    PATH
commands = python3 {toxinidir}/ci/security_review.py {posargs}

[testenv:security-deps]
description = Known-vulnerability audit of APM, validation, and scanner dependencies
skip_install = true
deps =
    apm-cli==0.31.0
    pyyaml==6.0.3
    cisco-ai-skill-scanner==2.1.0
    pip-audit==2.10.1
commands = pip-audit

[testenv:apm]
description = Install the collection and a subset; replay metadata-only consumers and audit
skip_install = true
deps =
    apm-cli==0.31.0
    pyyaml==6.0.3
commands = python {toxinidir}/ci/check_apm.py {posargs}
