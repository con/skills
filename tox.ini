[tox]
envlist = validate, stamped-evals
skipsdist = true

[testenv:validate]
description = Structural lint of all SKILL.md files and bundled Python scripts
skip_install = true
deps = pyyaml
    jsonschema[format-nongpl]
commands = python3 {toxinidir}/ci/validate_skills.py {posargs}

[testenv:stamped-evals]
description = Probe tests and mutant calibration for the STAMPED skills
skip_install = true
deps =
    pytest
    jsonschema[format-nongpl]
    pyyaml
    pytest-evals==0.3.4
commands =
    # evals/ is a submodule (this repository's `stamped-evals` branch): without
    # it the three commands below fail at import with nothing to act on.
    python3 -c "import pathlib, sys; sys.exit(0 if (pathlib.Path(r'{toxinidir}') / 'evals' / 'stamped' / 'tests').is_dir() else 'error: evals/ is not checked out. run: git submodule update --init evals')"
    # Fast gate: the ordinary tests. The eval cases are skipped without
    # --run-eval, which is what keeps this first command quick.
    python3 -m pytest {toxinidir}/evals/stamped/tests -q
    # The done criteria of docs/stamped/evals.md section 10.1, asserted over
    # every mutant and every recorded judgement round.
    python3 -m pytest {toxinidir}/evals/stamped/tests -q --run-eval --run-eval-analysis \
        --out-path {envtmpdir}/eval-out
    # The same scripted sweep again, for the JSON report a run record keeps.
    python3 {toxinidir}/evals/stamped/harness/calibrate.py {posargs}
